name: Build BtBridge APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download gnirehtet, patch VPN and compile single APK
        run: |
          curl -L -o gnirehtet-bin.zip https://github.com/Genymobile/gnirehtet/releases/download/v2.5.1/gnirehtet-java-v2.5.1.zip
          unzip -j gnirehtet-bin.zip "*/gnirehtet.jar" -d .
          curl -L -o gnirehtet-src.zip https://github.com/Genymobile/gnirehtet/archive/refs/tags/v2.5.1.zip
          unzip -q gnirehtet-src.zip
          rm -rf gnirehtet-2.5.1/app/src/main/res/mipmap-*
          python3 -c 'import re; p="gnirehtet-2.5.1/app/src/main/java/com/genymobile/gnirehtet/GnirehtetService.java"; s=open(p).read().replace("PendingIntent.getActivity(this, 0, stopIntent, 0)","PendingIntent.getActivity(this, 0, stopIntent, PendingIntent.FLAG_IMMUTABLE)"); s=re.sub(r"(^\s*)([^\n]*builder\.establish\(\);)",r"\1try { builder.addDisallowedApplication(\"com.android.vending\"); } catch (Exception ignored) {}\n\1\2",s,flags=re.M); open(p,"w").write(s)'
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          AJAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" | sort -V | tail -n 1)
          mkdir -p build/classes build/dex build/gen/com/genymobile/gnirehtet
          printf 'package com.genymobile.gnirehtet;\npublic final class BuildConfig { public static final boolean DEBUG = true; }\n' > build/gen/com/genymobile/gnirehtet/BuildConfig.java
          "$BT/aapt2" compile --dir gnirehtet-2.5.1/app/src/main/res -o build/gnirehtet_res.zip
          "$BT/aapt2" compile --dir res -o build/app_res.zip
          "$BT/aapt2" link -o build/unsigned.apk --manifest AndroidManifest.xml -I "$AJAR" \
            --custom-package com.genymobile.gnirehtet --java build/gen build/gnirehtet_res.zip build/app_res.zip
          javac --release 11 -cp "$AJAR:gnirehtet.jar" -d build/classes \
            build/gen/com/genymobile/gnirehtet/R.java \
            build/gen/com/genymobile/gnirehtet/BuildConfig.java \
            gnirehtet-2.5.1/app/src/main/java/com/genymobile/gnirehtet/*.java \
            src/com/akemi/btbridge/*.java
          "$BT/d8" --min-api 26 --output build/dex $(find build/classes -name "*.class") gnirehtet.jar
          (cd build/dex && zip -q -u ../unsigned.apk classes*.dex)
          "$BT/zipalign" -f 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Debug,O=Android,C=US"
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --out BtBridge.apk build/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BtBridge-Files
          path: BtBridge.apk
